spring.application.name=shopease-backend
server.port=8080

# Database Configuration (MySQL with automatic fallback to in-memory H2)
spring.datasource.url=jdbc:mysql://localhost:3306/shopease_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Cryptographic Configuration
app.jwt-secret=9a4f2c8d3b7a1e6f5c8d0b2a4e6f8a1c3e5b7d9f1a3c5e7b9d1f3a5c7e9b1d3f
app.jwt-expiration-milliseconds=86400000

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173
